name: SnapType CI & Release Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: snaptype_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Shared Packages
        run: npm run build:packages

      - name: Strict TypeScript Multi-Project Typecheck (ST-001)
        run: npm run typecheck

      - name: Build Backend API Server
        run: npm run build:api

      - name: Run Complete Test Suite (Unit, Integration & Performance Benchmarks)
        run: npm test

      - name: Build Web Application
        run: npm run build:web

      - name: Build Browser Extensions (Chrome & Firefox MV3)
        run: npm run build:extension

      - name: Package Extension Archives
        run: npm run package:extensions

      - name: Build & Package Production Release Extensions (No Loopback Permissions)
        run: |
          npm run build:extension:prod
          npm run package:extensions:prod

      - name: Validate Docker Compose Configuration (ST-005)
        run: docker compose --env-file .env.docker.example config

      - name: Test Real Docker Deployment & Healthcheck (Release Blocker 8)
        run: |
          cp .env.docker.example .env
          docker compose up -d --build
          sleep 20
          docker compose ps
          curl --fail --retry 15 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/health || (docker compose logs && exit 1)
          docker compose down -v

      - name: Upload Extension Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snaptype-extensions
          path: |
            dist/chrome-extension.zip
            dist/firefox-extension.zip
          retention-days: 14
