name: SnapType CI & Release Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: snaptype_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Shared Packages
        run: npm run build:packages

      - name: Strict TypeScript Multi-Project Typecheck (ST-001)
        run: npm run typecheck

      - name: Build Backend API Server
        run: npm run build:api

      - name: Run Complete Test Suite (Unit, Integration & Performance Benchmarks)
        run: npm test

      - name: Build Web Application
        run: npm run build:web

      - name: Build Browser Extensions (Chrome & Firefox MV3)
        run: npm run build:extension

      - name: Package Extension Archives
        run: npm run package:extensions

      - name: Build & Package Production Release Extensions (No Loopback Permissions)
        run: |
          npm run build:extension:prod
          npm run package:extensions:prod

      - name: Validate Docker Compose Configuration (ST-005)
        run: docker compose --env-file .env.docker.example config

      - name: Test Real Docker Deployment & Healthcheck (Fresh Installation)
        run: |
          cp .env.docker.example .env
          docker compose up -d --build
          sleep 20
          docker compose ps
          curl --fail --retry 15 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/health || (docker compose logs && exit 1)
          docker compose down -v

      - name: Test Persistent MySQL Volume Upgrade & Invitation Record Survival
        run: |
          cp .env.docker.example .env
          # 1. Start MySQL isolated to initialize volume
          docker compose up -d mysql
          sleep 15

          # 2. Seed legacy database schema and active plaintext invitation into persistent volume
          docker exec snaptype-mysql mysql -uroot -preplace_with_strong_root_password_32_chars snaptype_db -e "
            SET FOREIGN_KEY_CHECKS=0;
            CREATE TABLE IF NOT EXISTS users (
              id VARCHAR(36) PRIMARY KEY,
              email VARCHAR(255) NOT NULL UNIQUE,
              name VARCHAR(255),
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
            );
            CREATE TABLE IF NOT EXISTS workspaces (
              id VARCHAR(36) PRIMARY KEY,
              name VARCHAR(255) NOT NULL,
              slug VARCHAR(255) NOT NULL,
              owner_id VARCHAR(36) NOT NULL,
              is_personal BOOLEAN DEFAULT FALSE,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
            );
            CREATE TABLE IF NOT EXISTS workspace_invitations (
              id VARCHAR(36) PRIMARY KEY,
              workspace_id VARCHAR(36) NOT NULL,
              email VARCHAR(255) NOT NULL,
              role VARCHAR(20) NOT NULL DEFAULT 'editor',
              token VARCHAR(64) NOT NULL UNIQUE,
              invited_by_id VARCHAR(36) NOT NULL,
              expires_at TIMESTAMP NOT NULL,
              accepted_at TIMESTAMP NULL,
              revoked_at TIMESTAMP NULL,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
            );
            CREATE TABLE IF NOT EXISTS schema_migrations (
              id VARCHAR(255) PRIMARY KEY,
              applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
            );
            INSERT INTO users (id, email, name) VALUES ('u-legacy-1', 'inviter@snaptype.app', 'Inviter') ON DUPLICATE KEY UPDATE id=id;
            INSERT INTO workspaces (id, name, slug, owner_id) VALUES ('ws-legacy-1', 'Legacy Workspace', 'legacy-ws', 'u-legacy-1') ON DUPLICATE KEY UPDATE id=id;
            INSERT INTO workspace_invitations (id, workspace_id, email, role, token, invited_by_id, expires_at)
              VALUES ('inv-legacy-99', 'ws-legacy-1', 'pending.collaborator@company.com', 'editor', 'plaintextsecrettoken999999999999999999', 'u-legacy-1', DATE_ADD(NOW(), INTERVAL 7 DAY));
            INSERT INTO schema_migrations (id) VALUES ('0001_initial_schema.sql') ON DUPLICATE KEY UPDATE id=id;
            SET FOREIGN_KEY_CHECKS=1;
          "

          # 3. Stop containers while preserving the volume (no -v)
          docker compose down

          # 4. Start full stack with the updated production API container on top of persistent volume
          docker compose up -d --build
          sleep 20
          docker compose ps

          # 5. Verify API startup and healthcheck on upgraded database
          curl --fail --retry 15 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/health || (docker compose logs api && exit 1)

          # 6. Verify legacy invitation survived and was securely converted to token_hash
          EXPECTED_HASH=\$(echo -n "plaintextsecrettoken999999999999999999" | sha256sum | awk '{print \$1}')
          STORED_HASH=\$(docker exec snaptype-mysql mysql -uroot -preplace_with_strong_root_password_32_chars -N -s snaptype_db -e "SELECT token_hash FROM workspace_invitations WHERE id='inv-legacy-99';")
          if [ "\$STORED_HASH" != "\$EXPECTED_HASH" ]; then
            echo "Upgrade verification failed: Stored hash (\$STORED_HASH) does not match expected SHA-256 (\$EXPECTED_HASH)"
            exit 1
          fi
          echo "Legacy invitation safely upgraded to token_hash (\$STORED_HASH) on persistent volume"

          # 7. Verify API startup fails safely in production when migration files are missing
          docker compose run --rm -e MIGRATIONS_DIR=/tmp/empty_migrations api node apps/api/dist/server.js && exit 1 || echo "API startup safely failed when migration directory missing in production"

          # 8. Clean up volume
          docker compose down -v

      - name: Upload Extension Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snaptype-extensions
          path: |
            dist/chrome-extension.zip
            dist/firefox-extension.zip
          retention-days: 14
