name: SnapType CI & Release Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: snaptype_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Shared Packages
        run: npm run build:packages

      - name: Strict TypeScript Multi-Project Typecheck (ST-001)
        run: npm run typecheck

      - name: Build Backend API Server
        run: npm run build:api

      - name: Run Complete Test Suite (Unit, Integration & Performance Benchmarks)
        run: npm test

      - name: Build Web Application
        run: npm run build:web

      - name: Build Browser Extensions (Chrome & Firefox MV3)
        run: npm run build:extension

      - name: Package Extension Archives
        run: npm run package:extensions

      - name: Keep development extension archives as CI artifacts
        run: |
          mkdir -p artifacts
          cp dist/chrome-extension.zip artifacts/chrome-extension-dev.zip
          cp dist/firefox-extension.zip artifacts/firefox-extension-dev.zip

      - name: Validate production extension build (placeholder .test URLs - NOT a releasable package)
        env:
          SNAPTYPE_API_URL: https://api.example.test/api/v1
          SNAPTYPE_APP_URL: https://app.example.test
        run: |
          npm run build:extension:prod
          npm run package:extensions:prod

      - name: Validate Docker Compose Configuration (ST-005)
        run: docker compose --env-file .env.docker.example config

      - name: Generate ephemeral CI secrets
        run: |
          cp .env.docker.example .env
          {
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)"
            echo "MYSQL_PASSWORD=$(openssl rand -hex 24)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "OTP_HMAC_SECRET=$(openssl rand -hex 32)"
          } >> .env

      - name: Test Real Docker Deployment & Healthcheck (Fresh Installation)
        run: |
          docker compose up -d --build
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/health || (docker compose logs && exit 1)
          docker compose down -v

      - name: Test Persistent MySQL Volume Legacy Upgrade (real legacy fixture)
        run: bash scripts/ci/legacy-upgrade-test.sh

      - name: Surface container logs on failure
        if: failure()
        run: |
          for svc in api mysql; do
            N=40; [ "$svc" = mysql ] && N=6
            LOG=$(docker compose logs --no-color --tail "$N" "$svc" 2>&1 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=docker logs $svc::$LOG"
          done

      - name: Upload Extension Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snaptype-extensions
          path: |
            artifacts/chrome-extension-dev.zip
            artifacts/firefox-extension-dev.zip
          retention-days: 14
