# SnapType Production-Ready Docker Compose Setup
# Requires .env file (see .env.docker.example)

services:
  mysql:
    image: mysql:8.4
    container_name: snaptype-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Error: MYSQL_ROOT_PASSWORD must be configured in .env}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-snaptype_db}"
      MYSQL_USER: "${MYSQL_USER:-snaptype_user}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Error: MYSQL_PASSWORD must be configured in .env}"
    volumes:
      - mysql_data:/var/lib/mysql
    # Schema is owned exclusively by the API versioned migration runner (apps/api/src/db/migrate.ts).
    # MySQL is strictly isolated to the internal network (not exposed to host or internet)
    networks:
      - snaptype_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u snaptype_user -p$MYSQL_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: snaptype-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      TRUST_PROXY: "${TRUST_PROXY:-true}"
      DATABASE_URL: "mysql://${MYSQL_USER:-snaptype_user}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-snaptype_db}"
      DB_DRIVER: mysql
      JWT_SECRET: "${JWT_SECRET:?Error: JWT_SECRET must be configured in .env and at least 32 characters}"
      OTP_HMAC_SECRET: "${OTP_HMAC_SECRET:?Error: OTP_HMAC_SECRET must be configured in .env and at least 32 characters}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-SnapType <auth@example.com>}"
    networks:
      - snaptype_net
    # Port 3000 bound only to localhost for healthchecks / admin, proxied via Web Nginx container
    ports:
      - "127.0.0.1:3000:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: snaptype-web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - snaptype_net
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  mysql_data:

networks:
  snaptype_net:
    driver: bridge
