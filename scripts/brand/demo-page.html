<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Helpdesk demo (fictional page used for SnapType screenshots)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; background: #f4f5f7; color: #131412; display: flex; height: 100vh; overflow: hidden; }
  aside { width: 210px; background: #fff; border-right: 1px solid #e3e5e9; padding: 18px 14px; flex: none; }
  .logo { font-weight: 800; font-size: 17px; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
  .logo i { width: 22px; height: 22px; border-radius: 7px; background: #131412; display: inline-block; }
  nav a { display: flex; justify-content: space-between; padding: 9px 11px; border-radius: 10px; font-size: 14px; color: #565a63; margin-bottom: 2px; }
  nav a.on { background: #f1f2f4; color: #131412; font-weight: 600; }
  nav b { font-weight: 600; font-size: 12px; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { background: #fff; border-bottom: 1px solid #e3e5e9; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 17px; font-weight: 700; }
  header span { font-size: 13px; color: #565a63; }
  .thread { flex: 1; overflow: hidden; padding: 20px 24px 0; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 640px; background: #fff; border: 1px solid #e3e5e9; border-radius: 18px; padding: 14px 16px; font-size: 14px; line-height: 1.55; }
  .msg small { display: block; color: #565a63; font-size: 12px; margin-bottom: 4px; font-weight: 600; }
  .composer { background: #fff; border-top: 1px solid #e3e5e9; padding: 14px 24px 18px; }
  .composer label { font-size: 12px; font-weight: 700; color: #565a63; display: block; margin-bottom: 6px; }
  textarea { width: 100%; height: 150px; resize: none; border: 1px solid #c9ccd2; border-radius: 16px; padding: 14px 16px; font: inherit; font-size: 14px; line-height: 1.55; outline: none; background: #fff; }
  textarea:focus { border-color: #131412; box-shadow: 0 0 0 3px rgba(133,246,106,.45); }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 12px; color: #565a63; }
  button { font: inherit; font-weight: 650; font-size: 14px; border: 0; border-radius: 999px; padding: 10px 22px; background: #131412; color: #fff; }
</style>
</head>
<body>
  <aside>
    <div class="logo"><i></i> Helpdesk</div>
    <nav><a class="on">Inbox <b>12</b></a><a>Assigned to me <b>4</b></a><a>Waiting <b>7</b></a><a>Solved</a></nav>
  </aside>
  <main>
    <header><h1>Order #4821: delivery question</h1><span>Open · Priority: normal</span></header>
    <section class="thread">
      <div class="msg"><small>Maria Ionescu · 09:14</small>Hi! I ordered a desk lamp last week and it still has not arrived. Could you check what is going on?</div>
    </section>
    <section class="composer">
      <label for="reply">Reply to Maria</label>
      <textarea id="reply" placeholder="Write your reply…"></textarea>
      <div class="bar"><span>Tip: type a shortcut such as /late</span><button type="button">Send reply</button></div>
    </section>
  </main>
</body>
</html>
